(scriptTarget as Settings).dependencyResolutionManagement {
    versionCatalogs {
        create('gui') {
            def javafxVersion = version('javafx', '25.0.2')

            def libraries = ['base', 'controls', 'graphics', 'fxml', 'web', 'media']

            libraries.forEach {
                library(it, 'org.openjfx', "javafx-${it}").versionRef(javafxVersion)
            }

            bundle('javafx', libraries)

            library('controlsfx', 'org.controlsfx', 'controlsfx').version('latest.release')

            library('fontawesome', 'de.jensd', 'fontawesomefx-fontawesome').version('latest.release')
        }

        create('spring') {
            def springVersion = version('spring', 'latest.release')

            library('bom', 'org.springframework.boot', 'spring-boot-dependencies').versionRef(springVersion)

            def libraries = ['data-jpa', 'test']

            libraries.forEach {
                library("starter-${it}", 'org.springframework.boot', "spring-boot-starter-${it}")
                        .versionRef(springVersion)
            }
        }

        create('hibernate') {
            library('dialects', 'org.hibernate.orm', 'hibernate-community-dialects').withoutVersion()

            library('processor', 'org.hibernate.orm', 'hibernate-processor').withoutVersion()
        }

        create('libs') {
            library('sqlite', 'org.xerial', 'sqlite-jdbc').version('latest.release')

            library('guava', 'com.google.guava', 'guava').version('33.5.0-jre')

            library('jspecify', 'org.jspecify', 'jspecify').version('latest.release')
        }
    }
}