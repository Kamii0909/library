plugins {
    id 'java-library'
}

group = 'hust.kien.project'
version = '0.0.0'
description = 'library-core'

repositories {
    mavenCentral()
}

dependencies {
    implementation(platform(spring.bom))
    annotationProcessor(platform(spring.bom))

    implementation hibernate.dialects
    implementation libs.sqlite
    api spring.starter.data.jpa
    annotationProcessor hibernate.processor

    implementation libs.guava
    compileOnlyApi libs.jspecify

    testImplementation spring.starter.test
    testRuntimeOnly('org.junit.platform:junit-platform-launcher')
}

tasks.named('test', Test.class) {
    useJUnitPlatform()
}